# Per-repo runner configuration — NOT part of the canonical, synced engine.
#
# Sourced by run.sh and scripts/* to learn the ENV-var prefix that THIS repo's
# package hooks and tests expect. The prefix is applied to:
#   <PREFIX>_STOW_TARGET, <PREFIX>_REPO_ROOT, <PREFIX>_PACKAGE,
#   <PREFIX>_VERBOSE, <PREFIX>_KEEP_SUDO_SESSION
#
# This repo uses GRZ. Because the prefix lives here (per-repo, never synced),
# the engine scripts stay generic and read it from this file instead of
# hardcoding it.
RUNNER_ENV_PREFIX=GRZ

# Canonical engine source for `scripts/sync-runner pull`. This repo IS the
# canon, so this points at its own public remote. May be a URL or a local
# path; used only by `sync-runner pull`, never at install/verify time.
RUNNER_CANONICAL_REMOTE=https://github.com/Szwarceneger16/grz-workstation-tools.git
