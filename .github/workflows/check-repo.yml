name: check-repo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-repo:
    name: Repo consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check shell entrypoints
        run: |
          zsh -n run.sh
          zsh -n scripts/check-repo
          zsh -n scripts/system-copy-select
          zsh -n scripts/stow-select
          zsh -n scripts/list-packages
          zsh -n scripts/ensure-rcd-loaders
          zsh -n scripts/audit-public-safety
          zsh -n scripts/sync-runner

      - name: Run check-repo
        run: ./scripts/check-repo

      - name: Runner engine drift check
        run: ./scripts/sync-runner check

      - name: Audit public safety (secret/path leak scan)
        run: ./scripts/audit-public-safety
