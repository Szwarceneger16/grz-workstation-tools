name: check-repo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-repo:
    name: Repo consistency
    runs-on: ubuntu-24.04
    env:
      RUNNER_SYNC_EXPECTED_ROLE: source
      RUNNER_SYNC_WRITE: "0"
    steps:
      - name: Check out the exact revision
        # Pinned to SHA for supply-chain safety. Tag: v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check shell entrypoints
        run: |
          set -euo pipefail
          zsh -n run.sh
          zsh -n scripts/check-repo
          zsh -n scripts/system-copy-select
          zsh -n scripts/stow-select
          zsh -n scripts/list-packages
          zsh -n scripts/ensure-rcd-loaders
          zsh -n scripts/audit-public-safety
          python3 -m py_compile scripts/sync-runner scripts/propose-runner-release

      - name: Run repository checks
        run: ./scripts/check-repo

      - name: Verify exported code and documentation locks
        run: ./scripts/sync-runner check

      - name: Run release-train regression tests
        run: python3 -m unittest discover -s tests -p 'test_runner_*.py' -v

      - name: Audit public safety
        run: ./scripts/audit-public-safety
